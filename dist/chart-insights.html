<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your chart insights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #11151d;
      --panel: #191f29;
      --ink: #f2f1eb;
      --muted: #aeb8c4;
      --line: #35414d;
      --accent: #f1c86b;
      --fire: #f08a6c;
      --earth: #a7c77c;
      --air: #78c8dc;
      --water: #a89bf0;
      --quiet: #848d99;
      --display: "Bricolage Grotesque", "Avenir Next", sans-serif;
      --body: "Newsreader", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html { scrollbar-color: var(--accent) #1a202a; scrollbar-width: thin; }
    ::-webkit-scrollbar { width: 11px; height: 9px; }
    ::-webkit-scrollbar-track { background: #151b24; border-left: 1px solid #ffffff0b; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--air), var(--accent) 52%, var(--water)); border: 3px solid #151b24; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #a2e7ee, #ffe2a0 52%, #c9c1ff); }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        radial-gradient(1px 1px at 12% 16%, #fff9 0, transparent 100%),
        radial-gradient(1px 1px at 83% 11%, #f1c86b99 0, transparent 100%),
        radial-gradient(1px 1px at 72% 48%, #78c8dc88 0, transparent 100%),
        radial-gradient(1px 1px at 23% 67%, #ffffff77 0, transparent 100%),
        radial-gradient(1px 1px at 91% 82%, #a89bf099 0, transparent 100%),
        linear-gradient(155deg, #17202a 0%, #11151d 54%, #17201f 100%);
      background-size: 181px 167px, 239px 213px, 311px 287px, 263px 239px, 337px 301px, auto;
      color: var(--ink);
      font: 18px/1.55 var(--body);
    }
    a { color: inherit; }
    #chartDetails { width: min(100% - 32px, 920px); margin: 0 auto; padding: 32px 0 72px; }
    .details-back { display: inline-block; color: var(--muted); font: 600 14px var(--display); text-decoration: none; }
    .details-back:hover { color: var(--accent); }
    .details-heading { position: relative; padding: 54px 0 30px; border-bottom: 1px solid var(--line); }
    .details-heading::after { content: ""; position: absolute; right: 12px; bottom: -1px; width: 92px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent)); }
    .details-kicker { margin: 0 0 10px; color: var(--accent); font: 700 12px var(--display); text-transform: uppercase; }
    .details-heading h1, .details-empty h1 { margin: 0; font: 700 42px/1.05 var(--display); color: #fffdf6; }
    .details-summary { color: var(--muted); margin: 12px 0 0; }
    .details-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 18px 0; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
    .details-tab { flex: 0 0 auto; border: 1px solid transparent; border-radius: 999px; padding: 9px 14px; background: transparent; color: var(--muted); font: 600 14px var(--display); cursor: pointer; }
    .details-tab:hover { color: var(--ink); background: #ffffff0a; }
    .details-tab.is-active { border-color: #f2c94c66; background: #f2c94c18; color: var(--accent); }
    .details-tab:focus-visible, .details-primary:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .details-content { padding: 28px 0; }
    .details-section { animation: details-arrive 0.32s ease-out both; }
    @keyframes details-arrive { from { opacity: 0.55; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .details-section h2 { margin: 0 0 18px; font: 600 28px/1.15 var(--display); }
    .details-muted { color: var(--muted); }
    .details-more { position: relative; display: flex; justify-content: flex-end; min-height: 30px; margin-top: 8px; }
    .details-more-toggle { border: 0; padding: 4px 2px; background: transparent; color: var(--quiet); font: 500 12px var(--display); cursor: pointer; }
    .details-more-toggle:hover, .details-more-toggle.is-active { color: #c1c6cc; }
    .details-more-menu { position: absolute; z-index: 2; top: 30px; right: 0; min-width: 138px; padding: 5px; border: 1px solid #5a626e66; border-radius: 7px; background: #171c25; box-shadow: 0 10px 26px #0006; }
    .details-more-item { width: 100%; border: 0; border-radius: 4px; padding: 8px 10px; background: transparent; color: #969eaa; text-align: left; font: 500 13px var(--display); cursor: pointer; }
    .details-more-item:hover, .details-more-item.is-active { background: #ffffff0a; color: #c7ccd2; }
    .placement-list, .insight-list { border-top: 1px solid var(--line); }
    .overview-lead { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 22px; }
    .overview-lead h2 { margin-bottom: 8px; }
    .overview-lead p { margin: 0; }
    .overview-stats { display: flex; gap: 20px; flex: 0 0 auto; }
    .overview-stat { display: grid; gap: 2px; }
    .overview-stat-value { color: var(--accent); font: 700 25px/1 var(--display); }
    .overview-stat-label { color: var(--muted); font: 11px var(--display); }
    .overview-placement-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .overview-placement-card { --placement-color: var(--air); position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-width: 0; padding: 13px 11px; border: 1px solid color-mix(in srgb, var(--placement-color) 37%, var(--line)); border-radius: 7px; background: linear-gradient(145deg, color-mix(in srgb, var(--placement-color) 11%, var(--panel)), #151a22 78%); }
    .overview-placement-card.element-fire { --placement-color: var(--fire); }
    .overview-placement-card.element-earth { --placement-color: var(--earth); }
    .overview-placement-card.element-air { --placement-color: var(--air); }
    .overview-placement-card.element-water { --placement-color: var(--water); }
    .overview-placement-mark { color: var(--placement-color); font: 27px/1 var(--display); text-align: center; }
    .overview-placement-copy { min-width: 0; }
    .overview-placement-name { margin: 0; color: var(--muted); font: 11px var(--display); }
    .overview-placement-copy h3 { overflow: hidden; margin: 1px 0; color: var(--ink); font: 600 15px var(--display); text-overflow: ellipsis; }
    .overview-placement-meta { margin: 0; color: var(--placement-color); font: 11px var(--display); }
    .overview-house-chip { align-self: start; border: 1px solid color-mix(in srgb, var(--placement-color) 50%, transparent); border-radius: 999px; padding: 2px 6px; color: var(--placement-color); font: 10px var(--display); }
    .house-map { position: relative; width: min(100%, 380px); aspect-ratio: 1; margin: 38px auto 30px; border: 1px solid #7891a533; border-radius: 50%; background: radial-gradient(circle, #191f29 0 29%, #78c8dc0a 29.4% 30%, transparent 30.4% 51%, #f1c86b1c 51.3% 51.8%, transparent 52.1%), conic-gradient(from -15deg, #f08a6c12, #a7c77c12, #78c8dc12, #a89bf012, #f08a6c12); box-shadow: 0 0 55px #78c8dc0b, inset 0 0 40px #0005; }
    .house-map::before, .house-map::after { content: ""; position: absolute; inset: 14%; border: 1px solid #aeb8c422; border-radius: 50%; }
    .house-map::after { inset: 29%; border-color: #aeb8c41c; }
    .house-map-center { position: absolute; z-index: 1; inset: 34%; display: grid; align-content: center; justify-items: center; border: 1px solid #f1c86b66; border-radius: 50%; background: radial-gradient(circle at 40% 34%, #38424b, #181e27 74%); box-shadow: 0 0 26px #f1c86b13; }
    .house-map-glyph { color: var(--fire); font: 43px/1 var(--display); }
    .house-map-center-label { margin-top: 3px; color: var(--accent); font: 700 10px var(--display); letter-spacing: .12em; }
    .house-map-center-sign { color: var(--muted); font: 12px var(--display); }
    .house-map-marker { position: absolute; z-index: 2; top: 50%; left: 50%; display: grid; justify-items: center; width: 36px; transform: translate(-50%, -50%) rotate(var(--marker-angle)) translateY(-44%); }
    .house-map-marker-number { display: grid; width: 24px; height: 24px; place-items: center; border: 1px solid #9eabb944; border-radius: 50%; background: #171d26; color: var(--ink); font: 11px var(--display); }
    .house-map-marker-sign { margin-top: 2px; color: var(--accent); font: 14px var(--display); }
    .cusp-summary { margin-top: 25px; }
    .cusp-summary h3, .insight-row h3 { margin: 0 0 10px; font: 600 17px var(--display); }
    .cusp-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .cusp-card { display: grid; grid-template-columns: auto 19px minmax(0, 1fr); align-items: center; gap: 5px; min-width: 0; padding: 7px 8px; border-bottom: 1px solid var(--line); }
    .cusp-card-number { color: var(--muted); font: 10px var(--display); }
    .cusp-card-glyph { color: var(--air); font: 15px var(--display); }
    .cusp-card-sign { overflow: hidden; color: var(--ink); font: 11px var(--display); text-overflow: ellipsis; }
    .elements-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 24px; }
    .elements-heading h2 { margin-bottom: 8px; }
    .elements-heading p { margin: 0; }
    .element-total { display: grid; justify-items: end; line-height: 1.1; flex: 0 0 auto; }
    .element-total-value { color: var(--accent); font: 700 30px var(--display); }
    .element-total-label { color: var(--muted); font: 12px var(--display); }
    .element-orbit { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .element-card { --element: var(--air); position: relative; min-width: 0; overflow: hidden; padding: 17px 17px 15px; border: 1px solid color-mix(in srgb, var(--element) 38%, var(--line)); border-radius: 8px; background: linear-gradient(145deg, color-mix(in srgb, var(--element) 10%, var(--panel)), #131922 78%); animation: details-arrive 0.38s ease-out both; }
    .element-card:nth-child(2) { animation-delay: 35ms; }
    .element-card:nth-child(3) { animation-delay: 70ms; }
    .element-card:nth-child(4) { animation-delay: 105ms; }
    .element-card::after { content: ""; position: absolute; top: -24px; right: -19px; width: 88px; height: 88px; border: 1px solid color-mix(in srgb, var(--element) 23%, transparent); border-radius: 50%; box-shadow: 0 0 0 10px color-mix(in srgb, var(--element) 4%, transparent), 0 0 0 21px color-mix(in srgb, var(--element) 3%, transparent); pointer-events: none; }
    .element-fire { --element: var(--fire); }
    .element-earth { --element: var(--earth); }
    .element-air { --element: var(--air); }
    .element-water { --element: var(--water); }
    .element-card-heading { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; }
    .element-glyph { color: var(--element); font: 26px/1 var(--display); text-align: center; }
    .element-card-title h3 { margin: 0; color: var(--element); font: 600 17px var(--display); }
    .element-card-title p { margin: 2px 0 0; color: var(--muted); font: 12px/1.35 var(--display); }
    .element-count { color: var(--element); font: 700 24px var(--display); }
    .element-meter { height: 5px; margin: 16px 0 12px; overflow: hidden; border-radius: 999px; background: #0c1118; }
    .element-meter-fill { height: 100%; min-width: 0; border-radius: inherit; background: linear-gradient(90deg, color-mix(in srgb, var(--element) 62%, white), var(--element)); box-shadow: 0 0 12px color-mix(in srgb, var(--element) 48%, transparent); transition: width 0.45s ease-out; }
    .element-placement-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 25px; }
    .element-placement { border: 1px solid color-mix(in srgb, var(--element) 32%, transparent); border-radius: 999px; padding: 3px 8px; color: #e8e9e7; background: color-mix(in srgb, var(--element) 9%, transparent); font: 11px var(--display); }
    .element-none { color: #78818c; font: 12px var(--display); }
    .element-reading { display: grid; grid-template-columns: minmax(130px, 0.7fr) 1.5fr; column-gap: 24px; align-items: baseline; margin-top: 26px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .element-reading .details-kicker { margin: 0; }
    .element-reading h3 { margin: 0; color: #f4e6c5; font: 500 20px/1.3 var(--body); }
    .element-reading p:last-child { grid-column: 2; margin: 5px 0 0; }
    .element-note { margin: 14px 0 0; color: #818c98; font: 12px/1.5 var(--display); }
    .insight-row { padding: 16px 2px; border-bottom: 1px solid var(--line); }
    .insight-row p { margin: 0; color: var(--muted); }
    .insight-hero { display: flex; align-items: center; gap: 18px; margin-bottom: 31px; padding: 18px 20px; border: 1px solid #f1c86b44; border-radius: 8px; background: radial-gradient(ellipse at 10% 40%, #f1c86b15, transparent 60%), linear-gradient(110deg, #202a32, #191f29); }
    .insight-hero-glyph { display: grid; width: 64px; height: 64px; flex: 0 0 auto; place-items: center; border: 1px solid #f1c86b66; border-radius: 50%; color: var(--fire); font: 42px/1 var(--display); box-shadow: 0 0 26px #f1c86b12; }
    .insight-hero h2 { margin: 0 0 5px; }
    .insight-hero p { margin: 0; }
    .insight-block { margin-top: 30px; }
    .insight-block-heading { display: flex; align-items: center; gap: 12px; margin-bottom: 13px; }
    .insight-block-heading p, .insight-block-heading h3 { margin: 0; }
    .insight-block-heading h3 { color: var(--ink); font: 600 20px var(--display); }
    .insight-index { color: var(--accent); font: 700 13px var(--display); }
    .house-insight-list, .aspect-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .house-insight { padding: 15px; border: 1px solid var(--line); border-left: 2px solid var(--air); border-radius: 6px; background: linear-gradient(145deg, #202831, #171d25); }
    .house-insight-heading { display: flex; align-items: center; gap: 10px; }
    .house-insight-glyph { color: var(--air); font: 24px/1 var(--display); }
    .house-insight-overline { margin: 0 0 2px; color: var(--muted); font: 10px var(--display); text-transform: uppercase; }
    .house-insight h3 { margin: 0; color: var(--ink); font: 600 15px var(--display); }
    .house-insight > p { margin: 10px 0 8px; color: #d0d5d8; font-size: 15px; }
    .house-insight-cusp { color: var(--muted); font: 11px var(--display); }
    .aspect-card { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: linear-gradient(135deg, #242431, #171d25 75%); }
    .aspect-pair { display: flex; align-items: center; justify-content: center; gap: 7px; }
    .aspect-planet { color: var(--accent); font: 24px/1 var(--display); }
    .aspect-symbol { color: var(--water); font: 20px/1 var(--display); }
    .aspect-copy h3 { margin: 0 0 3px; color: var(--ink); font: 600 14px var(--display); }
    .aspect-copy p { margin: 0; color: var(--muted); font: 12px var(--display); }
    .details-empty { padding: 72px 0; max-width: 600px; }
    .details-empty p { color: var(--muted); }
    .details-primary { display: inline-block; margin-top: 14px; border-radius: 6px; padding: 11px 16px; background: var(--accent); color: #1a1226; font: 700 15px var(--display); text-decoration: none; }
    @media (max-width: 600px) {
      #chartDetails { width: min(100% - 24px, 920px); padding-top: 22px; }
      .details-heading { padding-top: 40px; }
      .details-heading h1, .details-empty h1 { font-size: 34px; }
      .placement-row { grid-template-columns: 1fr auto; gap: 4px 12px; }
      .placement-row > span:nth-child(2) { grid-column: 1; }
      .placement-degree { grid-column: 2; grid-row: 1 / span 2; }
      .elements-heading { align-items: flex-start; }
      .element-total { padding-top: 4px; }
      .element-total-value { font-size: 24px; }
      .element-orbit { grid-template-columns: 1fr; gap: 10px; }
      .element-card { padding: 14px; }
      .element-reading { grid-template-columns: 1fr; row-gap: 7px; }
      .element-reading p:last-child { grid-column: 1; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <main id="chartDetails"></main>
  <script src="./elm.js"></script>
  <script>
    let savedChart = null;
    try {
      const saved = JSON.parse(localStorage.getItem("zodiac-wheel:v1") || "null");
      savedChart = saved && saved.chart ? saved.chart : null;
    } catch (error) {
      savedChart = null;
    }
    window.Elm.Main.init({
      node: document.getElementById("chartDetails"),
      flags: { mode: "details", chart: savedChart }
    });
  </script>
</body>
</html>
